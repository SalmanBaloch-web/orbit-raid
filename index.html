<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Orbit Raid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one full-screen canvas, HUD strip on top, a single overlay card for menu and game over. Single dark look by choice. */
:root {
  --bg: #0b0f1d;
  --bg-deep: #070a14;
  --ink: #e8ecf8;
  --muted: #8a93b2;
  --ship: #7fd6ff;
  --foe: #ff6a57;
  --foe-2: #ffb347;
  --line: #1c2440;
  --font-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; touch-action: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud {
  position: absolute; inset: 0 0 auto 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 12px 16px;
  pointer-events: none;
}
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.value { font-family: var(--font-data); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat.right { align-items: flex-end; }
.pips { display: flex; gap: 5px; padding-top: 6px; }
.pip { width: 14px; height: 6px; background: var(--ship); transform: skewX(-20deg); transition: opacity .2s, background .2s; }
.pip.off { background: var(--line); }

.overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  background: color-mix(in srgb, var(--bg-deep) 82%, transparent);
}
.overlay[hidden] { display: none; }
.card { width: min(100%, 380px); display: flex; flex-direction: column; gap: 16px; }
.card h1 { margin: 0; font-size: clamp(40px, 13vw, 64px); line-height: 0.95; letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
.card h1 span { color: var(--ship); }
.card p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.5; max-width: 34ch; }
.how { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.how div { border-top: 2px solid var(--line); padding-top: 8px; font-size: 14px; line-height: 1.4; }
.how b { display: block; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ship); margin-bottom: 2px; }
.result { display: flex; gap: 24px; }
button#go {
  font: 700 18px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--bg-deep); background: var(--ship);
  border: 0; padding: 16px 20px; cursor: pointer;
  clip-path: polygon(0 0, 100% 0, 100% 70%, 94% 100%, 0 100%);
}
button#go:active { transform: translateY(1px); }
button#go:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>

<div id="app">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="stat"><span class="label">Score</span><span class="value" id="score">0</span></div>
    <div class="stat" style="align-items:center"><span class="label">Wave</span><span class="value" id="wave">1</span></div>
    <div class="stat right"><span class="label">Hull</span><div class="pips" id="pips"></div></div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card">
      <h1 id="title">Orbit <span>Raid</span></h1>
      <p id="sub">Dushman ke jahaz har taraf se aa rahe hain. Zinda raho aur zyada se zyada score banao.</p>
      <div class="how" id="how">
        <div><b>Left thumb</b>Chalne ke liye drag karo</div>
        <div><b>Right thumb</b>Drag karo, fire khud hoga</div>
      </div>
      <div class="result" id="result" hidden>
        <div class="stat"><span class="label">Score</span><span class="value" id="rs">0</span></div>
        <div class="stat"><span class="label">Best</span><span class="value" id="rb">0</span></div>
      </div>
      <button id="go" type="button">Shuru karo</button>
    </div>
  </div>
</div>

<script>
(function () {
  var cs = getComputedStyle(document.documentElement);
  var C = {
    ship: cs.getPropertyValue('--ship').trim(),
    foe: cs.getPropertyValue('--foe').trim(),
    foe2: cs.getPropertyValue('--foe-2').trim(),
    ink: cs.getPropertyValue('--ink').trim(),
    line: cs.getPropertyValue('--line').trim(),
    bg: cs.getPropertyValue('--bg').trim()
  };
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 0, H = 0;
  function resize() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * d); cv.height = Math.round(H * d);
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var elScore = document.getElementById('score'), elWave = document.getElementById('wave');
  var elPips = document.getElementById('pips'), overlay = document.getElementById('overlay');
  var MAXHP = 5;
  for (var i = 0; i < MAXHP; i++) { var p = document.createElement('span'); p.className = 'pip'; elPips.appendChild(p); }

  var best = 0;
  try { best = parseInt(localStorage.getItem('orbit-raid-best') || '0', 10) || 0; } catch (e) {}

  var state = 'menu';
  var P, bullets, foes, parts, score, kills, wave, spawnT, shake, t0;
  var stars = [];
  for (var s = 0; s < 70; s++) stars.push({ x: Math.random(), y: Math.random(), z: 0.3 + Math.random() * 0.9 });

  function reset() {
    P = { x: W / 2, y: H * 0.65, vx: 0, vy: 0, a: -Math.PI / 2, hp: MAXHP, cool: 0, inv: 0 };
    bullets = []; foes = []; parts = [];
    score = 0; kills = 0; wave = 1; spawnT = 0.8; shake = 0; t0 = 0;
    drawHud(true);
  }

  var lastScore = -1, lastWave = -1, lastHp = -1;
  function drawHud(force) {
    if (force || score !== lastScore) { elScore.textContent = score; lastScore = score; }
    if (force || wave !== lastWave) { elWave.textContent = wave; lastWave = wave; }
    if (force || P.hp !== lastHp) {
      for (var i = 0; i < MAXHP; i++) elPips.children[i].className = 'pip' + (i < P.hp ? '' : ' off');
      lastHp = P.hp;
    }
  }

  /* ---------- input ---------- */
  var R = 52;
  var sticks = { move: null, aim: null };
  var keys = {};
  var mouse = { x: 0, y: 0, down: false, used: false };

  function vec(st) {
    var dx = st.x - st.ox, dy = st.y - st.oy, l = Math.hypot(dx, dy);
    if (l < 6) return { x: 0, y: 0, m: 0 };
    var m = Math.min(1, l / R);
    return { x: dx / l * m, y: dy / l * m, m: m };
  }
  function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  cv.addEventListener('pointerdown', function (e) {
    var q = pos(e);
    if (e.pointerType === 'mouse') { mouse.down = true; mouse.used = true; mouse.x = q.x; mouse.y = q.y; return; }
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    var side = q.x < W / 2 ? 'move' : 'aim';
    if (!sticks[side]) sticks[side] = { id: e.pointerId, ox: q.x, oy: q.y, x: q.x, y: q.y };
  });
  cv.addEventListener('pointermove', function (e) {
    var q = pos(e);
    if (e.pointerType === 'mouse') { mouse.x = q.x; mouse.y = q.y; mouse.used = true; return; }
    ['move', 'aim'].forEach(function (k) {
      var st = sticks[k];
      if (st && st.id === e.pointerId) { st.x = q.x; st.y = q.y; }
    });
  });
  function up(e) {
    if (e.pointerType === 'mouse') { mouse.down = false; return; }
    ['move', 'aim'].forEach(function (k) { if (sticks[k] && sticks[k].id === e.pointerId) sticks[k] = null; });
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  /* ---------- game logic ---------- */
  function spawn() {
    var side = Math.floor(Math.random() * 4), x, y, m = 36;
    if (side === 0) { x = Math.random() * W; y = -m; }
    else if (side === 1) { x = W + m; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = H + m; }
    else { x = -m; y = Math.random() * H; }
    var r = Math.random(), type = 'grunt';
    if (wave >= 2 && r < 0.3) type = 'dart';
    if (wave >= 3 && r > 0.82) type = 'tank';
    var f = { x: x, y: y, type: type, a: 0 };
    if (type === 'grunt') { f.hp = 1; f.sp = 70 + wave * 6; f.r = 14; f.pts = 10; }
    if (type === 'dart') { f.hp = 1; f.sp = 130 + wave * 8; f.r = 10; f.pts = 20; }
    if (type === 'tank') { f.hp = 4; f.sp = 45 + wave * 3; f.r = 22; f.pts = 50; }
    f.max = f.hp;
    foes.push(f);
  }

  function burst(x, y, col, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283, s = 40 + Math.random() * 220;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.35 + Math.random() * 0.4, max: 0.75, col: col });
    }
  }

  function end() {
    state = 'over';
    var isBest = score > best;
    if (isBest) { best = score; try { localStorage.setItem('orbit-raid-best', String(best)); } catch (e) {} }
    document.getElementById('title').innerHTML = 'Jahaz <span>gira</span>';
    document.getElementById('sub').textContent = isBest ? 'Naya best score! Ek aur koshish karo.' : 'Thoda aur, best score tumhara intezar kar raha hai.';
    document.getElementById('how').hidden = true;
    document.getElementById('result').hidden = false;
    document.getElementById('rs').textContent = score;
    document.getElementById('rb').textContent = best;
    document.getElementById('go').textContent = 'Dobara khelo';
    overlay.hidden = false;
  }

  function update(dt) {
    t0 += dt;
    // movement
    var ix = 0, iy = 0;
    if (sticks.move) { var v = vec(sticks.move); ix = v.x; iy = v.y; }
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (keys['w'] || keys['arrowup']) iy -= 1;
    if (keys['s'] || keys['arrowdown']) iy += 1;
    var il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
    var k = Math.min(1, dt * 9), sp = 230;
    P.vx += (ix * sp - P.vx) * k; P.vy += (iy * sp - P.vy) * k;
    P.x = Math.max(16, Math.min(W - 16, P.x + P.vx * dt));
    P.y = Math.max(60, Math.min(H - 16, P.y + P.vy * dt));

    // aim and fire
    var firing = false;
    if (sticks.aim) {
      var av = vec(sticks.aim);
      if (av.m > 0.25) { P.a = Math.atan2(av.y, av.x); firing = true; }
    } else if (mouse.used) {
      P.a = Math.atan2(mouse.y - P.y, mouse.x - P.x);
      firing = mouse.down;
    } else if (il > 0.2) {
      P.a = Math.atan2(iy, ix);
    }
    P.cool -= dt; P.inv -= dt;
    if (firing && P.cool <= 0) {
      P.cool = 0.15;
      var a = P.a + (Math.random() - 0.5) * 0.06;
      bullets.push({ x: P.x + Math.cos(P.a) * 18, y: P.y + Math.sin(P.a) * 18, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, life: 1.1 });
    }

    // spawn
    spawnT -= dt;
    if (spawnT <= 0) {
      spawn();
      spawnT = Math.max(0.25, 1.0 - wave * 0.08) * (0.7 + Math.random() * 0.6);
    }

    // bullets
    for (var i = bullets.length - 1; i >= 0; i--) {
      var b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) bullets.splice(i, 1);
    }

    // foes
    for (var j = foes.length - 1; j >= 0; j--) {
      var f = foes[j];
      var dx = P.x - f.x, dy = P.y - f.y, d = Math.hypot(dx, dy) || 1;
      f.a = Math.atan2(dy, dx);
      f.x += dx / d * f.sp * dt; f.y += dy / d * f.sp * dt;

      var dead = false;
      for (var q = bullets.length - 1; q >= 0; q--) {
        var bb = bullets[q];
        if (Math.hypot(bb.x - f.x, bb.y - f.y) < f.r + 3) {
          bullets.splice(q, 1);
          f.hp--; burst(bb.x, bb.y, C.ink, 3);
          if (f.hp <= 0) { dead = true; break; }
        }
      }
      if (dead) {
        score += f.pts; kills++;
        burst(f.x, f.y, f.type === 'tank' ? C.foe2 : C.foe, f.type === 'tank' ? 26 : 14);
        foes.splice(j, 1);
        wave = 1 + Math.floor(kills / 12);
        continue;
      }
      if (P.inv <= 0 && d < f.r + 12) {
        P.hp--; P.inv = 1.0; shake = 10;
        burst(P.x, P.y, C.ship, 18);
        burst(f.x, f.y, C.foe, 10);
        foes.splice(j, 1);
        try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
        if (P.hp <= 0) { burst(P.x, P.y, C.ship, 40); drawHud(); end(); return; }
      }
    }

    // particles
    for (var m = parts.length - 1; m >= 0; m--) {
      var pt = parts[m];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= 0.96; pt.vy *= 0.96; pt.life -= dt;
      if (pt.life <= 0) parts.splice(m, 1);
    }
    shake = Math.max(0, shake - dt * 30);
    drawHud();
  }

  /* ---------- drawing ---------- */
  function drawShip(x, y, a, col, s) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(18 * s, 0); ctx.lineTo(-12 * s, -11 * s); ctx.lineTo(-6 * s, 0); ctx.lineTo(-12 * s, 11 * s); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.restore();
  }

  function draw(dt) {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // stars
    ctx.fillStyle = C.ink;
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      st.y += dt * 12 * st.z / H; if (st.y > 1) st.y -= 1;
      ctx.globalAlpha = 0.18 + st.z * 0.3;
      ctx.fillRect(st.x * W, st.y * H, st.z * 1.6, st.z * 1.6);
    }
    ctx.globalAlpha = 1;

    if (state === 'play' || state === 'over') {
      // bullets
      ctx.strokeStyle = C.ship; ctx.lineWidth = 3; ctx.lineCap = 'round';
      bullets.forEach(function (b) {
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.022, b.y - b.vy * 0.022); ctx.stroke();
      });
      // foes
      foes.forEach(function (f) {
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
        ctx.beginPath();
        if (f.type === 'grunt') {
          ctx.moveTo(f.r, 0); ctx.lineTo(-f.r, -f.r * 0.9); ctx.lineTo(-f.r * 0.4, 0); ctx.lineTo(-f.r, f.r * 0.9);
          ctx.closePath(); ctx.fillStyle = C.foe;
        } else if (f.type === 'dart') {
          ctx.moveTo(f.r * 1.6, 0); ctx.lineTo(-f.r, -f.r * 0.7); ctx.lineTo(-f.r, f.r * 0.7);
          ctx.closePath(); ctx.fillStyle = C.foe2;
        } else {
          for (var n = 0; n < 6; n++) { var an = n * Math.PI / 3; ctx.lineTo(Math.cos(an) * f.r, Math.sin(an) * f.r); }
          ctx.closePath(); ctx.fillStyle = C.foe2;
        }
        ctx.fill();
        if (f.type === 'tank') {
          ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(0, 0, f.r * 0.5 * (f.hp / f.max) + 2, 0, 6.283); ctx.fill();
        }
        ctx.restore();
      });
      // player
      if (state === 'play') {
        var blink = P.inv > 0 && Math.floor(P.inv * 14) % 2 === 0;
        if (!blink) drawShip(P.x, P.y, P.a, C.ship, 1);
      }
      // particles
      parts.forEach(function (p) {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = p.col; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      });
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // sticks
    if (state === 'play') {
      ['move', 'aim'].forEach(function (k) {
        var s = sticks[k]; if (!s) return;
        var v = vec(s);
        ctx.strokeStyle = C.line; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.ox, s.oy, R, 0, 6.283); ctx.stroke();
        ctx.fillStyle = k === 'aim' ? C.foe2 : C.ship; ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(s.ox + v.x * R, s.oy + v.y * R, 20, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
      });
    }
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    draw(dt);
    requestAnimationFrame(frame);
  }

  document.getElementById('go').addEventListener('click', function () {
    resize(); reset();
    sticks.move = null; sticks.aim = null;
    state = 'play'; overlay.hidden = true;
  });

  reset();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
